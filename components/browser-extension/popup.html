<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocFlow Page Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark">W</span>
      <div>
        <strong>WestoryVisa Autofill</strong>
        <small id="version"></small>
      </div>
      <span class="status-dot" id="statusDot"></span>
    </header>
    <section>
      <span class="eyebrow">当前状态</span>
      <h1 id="statusTitle">正在检查</h1>
      <p id="statusMessage">正在读取本机任务状态。</p>
      <dl>
        <div><dt>页面</dt><dd id="pageLabel">未连接</dd></div>
        <div><dt>字段</dt><dd id="progress">0 / 0</dd></div>
      </dl>
    </section>
    <button id="continueButton" type="button" disabled>我已进入表格，开始连续填写</button>
    <button class="secondary" id="stopButton" type="button" disabled>暂停当前任务</button>
    <p class="boundary">验证码、登录和最终 Sign/Submit 由人工完成；普通表格校验通过后自动 Next。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
