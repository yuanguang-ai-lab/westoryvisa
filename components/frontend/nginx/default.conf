map "$viewer_worker:$viewer_mode" $computer_use_upstream {
    default "";
    "agent-v2-a:view" "http://agent-v2:6080";
    "agent-v2-a:control" "http://agent-v2:6081";
    "agent-v2-b:view" "http://agent-v2-b:6080";
    "agent-v2-b:control" "http://agent-v2-b:6081";
    "agent-v2-chrome:view" "http://agent-v2-chrome:6080";
    "agent-v2-chrome:control" "http://agent-v2-chrome:6081";
}

server {
    listen 80;
    server_name _;

    # proxy_pass below contains the captured noVNC path, so nginx resolves
    # the Docker service name at request time instead of only at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    absolute_redirect off;

    # Prevent an old HTML shell from being paired with newly deployed assets.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = / {
        try_files /product.html =404;
    }

    location = /index.html {
        return 308 /;
    }

    location = /workspace {
        try_files /workspace.html =404;
    }

    location = /workspace/ {
        return 308 /workspace;
    }

    location = /membership {
        try_files /membership.html =404;
    }

    location = /membership/ {
        return 308 /membership;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location = /terms/ {
        return 308 /terms;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /privacy/ {
        return 308 /privacy;
    }

    location = /refund-policy {
        try_files /refund-policy.html =404;
    }

    location = /refund-policy/ {
        return 308 /refund-policy;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    location = /contact/ {
        return 308 /contact;
    }

    location = /admin/payments {
        alias /usr/share/nginx/html/admin-payments.html;
        default_type text/html;
    }

    location = /admin/payments/ {
        return 308 /admin/payments;
    }

    location = /payment-console {
        return 308 /admin/payments;
    }

    location = /payment-console/ {
        return 308 /admin/payments;
    }

    location = /payment-console.html {
        return 308 /admin/payments;
    }

    location = /landing-page {
        try_files /product.html =404;
    }

    location = /landing-page/ {
        return 308 /landing-page;
    }

    location = /landingpage {
        return 308 /landing-page;
    }

    location = /landingpage/ {
        return 308 /landing-page;
    }

    location = /product {
        return 308 /landing-page;
    }

    location = /analytics {
        try_files /analytics.html =404;
    }

    location = /backend-status {
        proxy_pass http://backend:4176/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # noVNC is never exposed as a raw public port.  Every static asset and
    # WebSocket handshake is authorized against the signed-in tenant and the
    # exact short-lived Gemini V2 viewer token before it reaches the Agent
    # container.
    location = /_computer-use-auth {
        internal;
        proxy_pass http://backend:4176/api/computer-use/view-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-DocFlow-Viewer-Token $viewer_token;
        proxy_set_header X-DocFlow-Viewer-Mode $viewer_mode;
        proxy_set_header X-DocFlow-Viewer-Worker $viewer_worker;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker id is an explicit allowlist above, never an arbitrary hostname.
    # This prevents a tenant-controlled URL from turning nginx into an SSRF
    # proxy while still routing each browser session to its lease owner.
    location ~ "^/computer-use/(?<viewer_worker>agent-v2-(?:a|b|chrome))/(?<viewer_mode>view|control)/(?<viewer_token>[A-Za-z0-9_-]{40,128})/(?<novnc_path>.*)$" {
        # The path contains a short-lived bearer capability. Never persist it
        # in nginx access logs.
        access_log off;
        auth_request /_computer-use-auth;
        proxy_pass $computer_use_upstream/$novnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ "^/computer-use/view/(?<viewer_token>[A-Za-z0-9_-]{40,64})/(?<novnc_path>.*)$" {
        access_log off;
        set $viewer_mode view;
        auth_request /_computer-use-auth;
        proxy_pass http://agent-v2:6080/$novnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ "^/computer-use/control/(?<viewer_token>[A-Za-z0-9_-]{40,64})/(?<novnc_path>.*)$" {
        access_log off;
        set $viewer_mode control;
        auth_request /_computer-use-auth;
        proxy_pass http://agent-v2:6081/$novnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
