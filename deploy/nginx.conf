server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    absolute_redirect off;

    location = /workspace {
        try_files /workspace.html =404;
    }

    location = /workspace/ {
        return 308 /workspace;
    }

    location = /membership {
        try_files /membership.html =404;
    }

    location = /membership/ {
        return 308 /membership;
    }

    location = /admin/payments {
        alias /usr/share/nginx/html/admin-payments.html;
        default_type text/html;
    }

    location = /admin/payments/ {
        return 308 /admin/payments;
    }

    location = /payment-console {
        return 308 /admin/payments;
    }

    location = /payment-console/ {
        return 308 /admin/payments;
    }

    location = /payment-console.html {
        return 308 /admin/payments;
    }

    location = /landing-page {
        try_files /product.html =404;
    }

    location = /landing-page/ {
        return 308 /landing-page;
    }

    location = /landingpage {
        return 308 /landing-page;
    }

    location = /landingpage/ {
        return 308 /landing-page;
    }

    location = /product {
        return 308 /landing-page;
    }

    location = /analytics {
        try_files /analytics.html =404;
    }

    location = /backend-status {
        proxy_pass http://backend:4176/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
}
