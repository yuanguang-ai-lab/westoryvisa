<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="WestoryVisa 机构账号、会员购买与签证顾问工作台入口。">
  <title>WestoryVisa｜机构接入</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23d7ff3f'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='24' font-family='Arial' font-weight='700' fill='%23111'%3EWV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260814-home-clean-v1">
</head>
<body>
  <div class="organization-shell">
    <header class="organization-header home-header">
      <a class="organization-brand" href="/" aria-label="返回 WestoryVisa 机构接入首页">
        <span class="brand-mark" lang="en">WV</span>
        <span><strong lang="en">WestoryVisa</strong><small>开始客户流程之前</small></span>
      </a>
      <a class="organization-logout" href="/workspace">登录账号</a>
    </header>

    <main class="content organization-content">
      <section class="portal-hero">
        <div>
          <div class="page-kicker">机构接入 · 开始客户流程之前</div>
          <h1>机构账号、会员与工作台，<br>从这里开始。</h1>
          <p>登录或注册机构账号后选择会员方案；支付确认到账后，才能进入客户工作台。</p>
        </div>
        <div class="portal-status observe">
          <span>当前入口</span>
          <strong>先建立账号，再开通会员</strong>
        </div>
      </section>

      <section class="portal-path" aria-label="进入 WestoryVisa 前的流程">
        <article class="portal-step ready">
          <span>1</span>
          <div>
            <small>机构账号</small>
            <h2>登录或注册机构账号</h2>
            <p>账号建立后自动返回会员页面；未购买或会员已过期时，工作台不会开放。</p>
            <a class="btn" href="/workspace">登录 / 注册并选择会员 →</a>
          </div>
        </article>
        <article class="portal-step">
          <span>2</span>
          <div>
            <small>会员与支付</small>
            <h2>选择会员方案并完成支付</h2>
            <p>按团队需要选择方案；四方聚合支付确认到账后自动开通工作台。</p>
            <div class="portal-step-actions">
              <a class="btn secondary" href="/membership">立即购买会员</a>
            </div>
          </div>
        </article>
      </section>

      <section class="portal-boundary-note">
        <strong>页面边界</strong>
        <span>机构接入是网站首页；顶部不提供跨页面导航，账号、购买和工作台按正文流程依次进入。</span>
      </section>
    </main>
  </div>
  <script>
    (function enableLocalFileNavigation() {
      if (window.location.protocol !== "file:") return;
      const localRoutes = {
        "/": "index.html",
        "/membership": "membership.html",
        "/workspace": "workspace.html"
      };
      document.querySelectorAll("a[href]").forEach((link) => {
        const localTarget = localRoutes[link.getAttribute("href")];
        if (localTarget) link.setAttribute("href", localTarget);
      });
    })();
  </script>
</body>
</html>
