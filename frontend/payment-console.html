<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>WestoryVisa｜真实支付工程</title>
  <link rel="stylesheet" href="/styles.css?v=20260812-portal-pages-v2">
</head>
<body>
  <div class="organization-shell">
    <header class="organization-header">
      <a class="organization-brand" href="/" aria-label="返回 WestoryVisa 机构接入首页"><span class="brand-mark">WV</span><span><strong>WestoryVisa</strong><small>开始客户流程之前</small></span></a>
      <nav class="organization-nav" aria-label="机构接入导航">
        <a href="/">机构接入</a><a href="/membership">会员中心</a><a class="active" href="/payment-console">真实支付工程</a><a href="/workspace">进入工作台</a>
      </nav>
      <a class="organization-logout" href="/workspace">登录账号</a>
    </header>
    <main class="content organization-content portal-subpage">
      <div class="topbar payment-console-topbar">
        <div><div class="page-kicker">机构支付</div><h1>真实支付工程</h1><p class="muted">会员商品、支付通道、订单状态、回调验签与退款检查集中管理。</p></div>
        <div class="topbar-actions"><a class="btn secondary" href="/membership">会员中心</a><a class="btn secondary" href="/">返回机构接入</a></div>
      </div>
      <div class="payment-observe-banner"><span>独立板块</span><strong>支付工程与落地页分开，不在产品宣传页中处理交易。</strong></div>
      <nav class="payment-console-nav" aria-label="真实支付工程板块"><button class="active" type="button"><span>1</span>全流程</button><button type="button"><span>2</span>商户与密钥</button><button type="button"><span>3</span>商品与金额</button><button type="button"><span>4</span>真实下单</button><button type="button"><span>5</span>回调与验签</button><button type="button"><span>6</span>查单与退款</button></nav>
      <section class="payment-console-block payment-overview">
        <div class="section-heading"><span class="page-kicker">真实支付工程图</span><h2>每个板块单独检查</h2><p class="muted">登录机构账号后读取当前机构的通道配置、真实订单和运行记录。</p></div>
        <div class="payment-workflow-grid"><div class="payment-workflow-step"><span>1</span><div><strong>商户资质</strong><small>机构准备</small></div></div><div class="payment-workflow-step"><span>2</span><div><strong>通道配置</strong><small>密钥检查</small></div></div><div class="payment-workflow-step"><span>3</span><div><strong>订单与回调</strong><small>交易核验</small></div></div><div class="payment-workflow-step"><span>4</span><div><strong>退款与记录</strong><small>可审计</small></div></div></div>
        <div class="payment-overview-stats"><div><strong>0</strong><span>已就绪真实通道</span></div><div><strong>0</strong><span>真实订单</span></div><div><strong>0</strong><span>验签通过回调</span></div><div><strong>0</strong><span>退款记录</span></div></div>
        <div class="actions"><a class="btn" href="/workspace">登录账号查看状态</a></div>
      </section>
    </main>
  </div>
</body>
</html>
